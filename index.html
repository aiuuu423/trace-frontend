<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行迹 | Trace V1.4</title>
    
    <link rel="preconnect" href="https://cloud.dify.ai" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js" defer></script>
    
    <style>
        /* 深度定制，完美融入玻璃态 UI */
        .ts-wrapper .ts-control { 
            background-color: rgba(255, 255, 255, 0.7) !important; 
            border: 1px solid white !important; 
            border-radius: 1rem !important; 
            height: 56px !important; 
            min-height: 56px !important;
            padding: 0 20px !important; 
            display: flex !important; 
            align-items: center !important; 
            font-size: 0.875rem !important; 
            box-shadow: none !important; 
            color: #334155 !important; 
            box-sizing: border-box !important;
        }
        .ts-wrapper.single .ts-control .item { margin: 0 !important; padding: 0 !important; max-width: 100% !important; display: block; transform: translateY(1px); } 
        .ts-wrapper .ts-control input { margin: 0 !important; padding: 0 !important; font-size: 0.875rem !important; height: 100% !important; background: transparent !important; }

        /* 强制隐藏引擎：解决 PC 端排版冲突 */
        .view-section.hidden { display: none !important; }

        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; overflow-x: hidden; background-color: #eef2f6; color: #334155; margin: 0; }
        .font-serif-sc { font-family: 'Noto Serif SC', serif; }
        
        .mesh-bg-container { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%); }
        .mesh-blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6; transition: transform 0.4s ease-out; }
        .blob-1 { width: 50vw; height: 50vw; background: #bfdbfe; top: -10%; left: -10%; animation: float1 25s infinite alternate ease-in-out; }
        .blob-2 { width: 45vw; height: 45vw; background: #c7d2fe; bottom: -10%; right: -5%; animation: float2 30s infinite alternate-reverse ease-in-out; }
        .blob-3 { width: 35vw; height: 35vw; background: #bae6fd; top: 30%; left: 40%; animation: float3 20s infinite alternate ease-in-out; }

        @keyframes float1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5%, 5%) scale(1.05); } }
        @keyframes float2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5%, -5%) scale(1.1); } }
        @keyframes float3 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(3%, -3%) scale(0.95); } }

        .glass-panel { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 20px 40px -10px rgba(100, 116, 139, 0.12); border-radius: 24px; }
        .glass-btn { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.9); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; color: #475569; }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.95); transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.2); color: #1e293b; }
        
        .vault-tab { transition: all 0.4s ease; border: 2px solid transparent; }
        .vault-tab.active { background: rgba(255, 255, 255, 0.95); border-color: #e0e7ff; box-shadow: 0 12px 24px -6px rgba(147, 197, 253, 0.25); transform: translateY(-4px); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
        
        #dify-chatbot-bubble-button {
            bottom: 32px !important; 
            right: 104px !important; 
            width: 56px !important;
            height: 56px !important;
            border-radius: 50% !important;
            filter: grayscale(60%) brightness(0.7) !important;
            -webkit-filter: grayscale(60%) brightness(0.7) !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12) !important;
            transition: all 0.3s ease !important;
            z-index: 8900 !important;
        }

        #dify-chatbot-bubble-button:hover {
            filter: grayscale(60%) brightness(0.6) !important;
            -webkit-filter: grayscale(60%) brightness(0.6) !important;
            transform: scale(1.05);
        }

        #dify-chatbot-bubble-window {
            bottom: 104px !important; 
            right: 32px !important; 
            border-radius: 24px !important; 
            box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.15), 0 0 2px rgba(0, 0, 0, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            overflow: hidden !important; 
            width: 380px !important;
            height: 620px !important;
            z-index: 8901 !important;
        }

        @media (max-width: 768px) {
            .mesh-blob { animation: none !important; filter: blur(50px) !important; }
            #dify-chatbot-bubble-button { 
                top: 24px !important; 
                right: 24px !important; 
                bottom: auto !important; 
                transform: scale(0.85); 
                box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important;
            }
            #dify-chatbot-bubble-window {
                width: 90vw !important;  
                height: 80dvh !important; 
                top: 90px !important; 
                right: 5vw !important;
                bottom: auto !important;
            }
        }
    </style>
</head>
<body class="antialiased tracking-wide">

    <div class="mesh-bg-container" id="parallax-bg">
        <div class="mesh-blob blob-1"></div><div class="mesh-blob blob-2"></div><div class="mesh-blob blob-3"></div>
    </div>

    <div id="sync-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[20000] hidden flex-col items-center justify-center transition-all">
        <div class="animate-spin text-5xl mb-4">🪐</div>
        <p class="text-white text-sm tracking-[0.2em] font-light">正在跨越星海同步您的漫游记忆...</p>
        <p class="text-white/50 text-[10px] tracking-widest mt-3">光影数据庞大，请耐心等待片刻</p>
    </div>

    <div id="auth-overlay" class="fixed inset-0 bg-slate-900/10 backdrop-blur-md z-[10000] flex items-center justify-center hidden transition-all duration-700">
        <div class="glass-panel p-10 max-w-sm w-full text-center space-y-6 shadow-2xl mx-4 relative overflow-hidden">
            <div class="text-4xl opacity-80">🪐</div>
            <div class="space-y-3 relative z-10">
                <h3 class="text-2xl font-serif-sc font-normal text-slate-800 tracking-widest">契入漫游舱</h3>
                <p class="text-[10px] text-slate-400 leading-relaxed font-light tracking-widest">首次探索请开辟新空域，已有星图请直接回归</p>
            </div>
            <div class="space-y-3 relative z-10">
                <input type="text" id="user-code-input" placeholder="输入用户名 / 账号" class="w-full px-5 py-4 bg-white/60 border border-white/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200 text-center font-normal text-slate-700 text-sm shadow-inner transition-all">
                <input type="password" id="user-password-input" placeholder="输入专属密钥" class="w-full px-5 py-4 bg-white/60 border border-white/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200 text-center font-normal text-slate-700 text-sm shadow-inner transition-all">
            </div>
            <div class="flex gap-4 pt-2 relative z-10">
                <button onclick="handleAuth('login')" class="flex-1 py-4 bg-slate-800 text-white font-normal rounded-xl text-xs tracking-widest shadow-lg hover:bg-slate-700 transition-all">回归漫游</button>
                <button onclick="handleAuth('register')" class="flex-1 py-4 bg-white/80 text-slate-700 font-normal rounded-xl text-xs tracking-widest border border-white hover:bg-white transition-all shadow-sm">开辟新空域</button>
            </div>
        </div>
    </div>

    <div id="photo-preview-modal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl z-[12000] hidden flex flex-col items-center justify-center transition-opacity duration-300 opacity-0" onclick="closePhotoPreview()">
        <button class="absolute top-8 right-8 text-white/50 hover:text-white text-4xl font-light transition-colors z-50">&times;</button>
        <button id="gallery-prev" class="absolute left-4 md:left-12 text-white/30 hover:text-white text-6xl font-light transition-all z-50 hover:-translate-x-2" onclick="event.stopPropagation(); prevPhoto()">&#8249;</button>
        <img id="photo-preview-img" src="" class="max-w-[85vw] max-h-[85vh] object-contain transform scale-95 transition-transform duration-300 shadow-2xl rounded-sm pointer-events-auto" onclick="event.stopPropagation()">
        <button id="gallery-next" class="absolute right-4 md:right-12 text-white/30 hover:text-white text-6xl font-light transition-all z-50 hover:translate-x-2" onclick="event.stopPropagation(); nextPhoto()">&#8250;</button>
        <div id="gallery-counter" class="absolute bottom-8 text-white/50 text-xs tracking-widest font-sans font-medium">1 / 1</div>
    </div>

    <button onclick="openFeedback()" class="fixed bottom-8 right-8 w-14 h-14 bg-white/90 backdrop-blur-md rounded-full shadow-2xl flex items-center justify-center text-2xl z-[9000] border border-white hover:scale-110 transition-transform duration-300">💬</button>
    
    <div id="feedback-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[10500] hidden flex justify-end transition-opacity duration-300 opacity-0">
        <div class="w-full md:w-[400px] bg-[#f8fafc] h-full shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col" id="feedback-drawer">
            <div class="px-8 py-6 border-b border-slate-200 flex justify-between items-center bg-white/80 backdrop-blur-md">
                <h3 class="text-xl font-serif-sc text-slate-800 tracking-wider">星空回音站</h3>
                <button onclick="closeFeedback()" class="text-3xl text-slate-400 hover:text-slate-800 transition-colors">&times;</button>
            </div>
            <div class="p-8 flex-1 space-y-6 overflow-y-auto">
                <div>
                    <label class="block text-[11px] font-medium text-slate-400 mb-3 tracking-widest uppercase">回音类型</label>
                    <select id="fb-type" class="w-full px-5 py-4 bg-white rounded-xl focus:ring-2 focus:ring-blue-100 text-sm border-none shadow-sm outline-none">
                        <option>💡 体验与功能期待</option>
                        <option>🐛 遇到星轨偏差 (Bug)</option>
                        <option>🎨 视觉与交互感想</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-400 mb-3 tracking-widest uppercase">详细回音</label>
                    <textarea id="fb-content" rows="6" placeholder="请留下你的回音，它将化作电波，同步至开发者的星空数据中心..." class="w-full px-5 py-5 bg-white rounded-xl focus:ring-2 focus:ring-blue-100 text-sm font-normal shadow-sm outline-none leading-relaxed resize-none"></textarea>
                </div>
                <button onclick="submitFeedback()" class="w-full py-4 bg-[#1e293b] text-white font-normal rounded-xl shadow-lg hover:bg-slate-700 transition-all text-xs tracking-[0.2em]">🚀 发射至监测站</button>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[15000] hidden flex justify-end transition-opacity duration-300 opacity-0">
        <div class="w-full md:w-[500px] bg-[#f8fafc] h-full shadow-2xl overflow-y-auto transform translate-x-full transition-transform duration-300" id="detail-drawer">
            <div class="px-8 py-6 border-b border-slate-200 flex justify-between items-center bg-white/80 backdrop-blur-md sticky top-0 z-10">
                <h3 class="text-xl font-serif-sc text-slate-800 tracking-wider" id="detail-modal-title">漫游录</h3>
                <button onclick="closeDetailModal()" class="text-3xl text-slate-400 hover:text-slate-800 transition-colors">&times;</button>
            </div>
            <div class="p-8 space-y-6" id="detail-modal-content"></div>
        </div>
    </div>

    <div id="custom-confirm" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[11000] hidden flex items-center justify-center transition-opacity duration-300 opacity-0">
        <div class="glass-panel p-8 max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-300" id="custom-confirm-box">
            <div class="text-3xl mb-4">🍂</div>
            <h3 class="text-lg font-serif-sc text-slate-800 mb-8 leading-relaxed" id="custom-confirm-msg">提示信息</h3>
            <div class="flex gap-4">
                <button id="custom-confirm-cancel" class="flex-1 py-3 px-4 bg-white/80 text-slate-600 font-normal rounded-xl hover:bg-white transition-all tracking-widest text-sm border border-slate-200 shadow-sm">取消</button>
                <button id="custom-confirm-ok" class="flex-1 py-3 px-4 bg-red-50 text-red-500 font-normal rounded-xl shadow-sm hover:bg-red-100 transition-all text-sm tracking-widest">确认</button>
            </div>
        </div>
    </div>

    <div id="inline-toast" class="fixed top-[15%] left-1/2 -translate-x-1/2 transform -translate-y-10 scale-95 opacity-0 pointer-events-none transition-all duration-500 z-[99999]">
        <div class="glass-panel px-8 py-4 rounded-full text-sm text-slate-700 shadow-2xl font-normal flex items-center gap-3 border border-white">
            <span class="text-lg">✨</span>
            <span id="toast-msg" class="tracking-widest"></span>
        </div>
    </div>

    <div id="mobile-capsule-nav" class="flex md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/70 backdrop-blur-2xl border border-white/50 shadow-[0_20px_40px_-10px_rgba(0,0,0,0.15)] rounded-full px-6 py-3 items-center justify-between w-[92vw] max-w-[400px] z-[9999] transition-all duration-300" style="padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));">
        <button onclick="switchView('dashboard-view'); toggleSubView('map');" class="flex flex-col items-center gap-1 text-slate-800 w-14">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"></path></svg>
            <span class="text-[10px] tracking-[0.1em] font-medium mt-0.5">地球大盘</span>
        </button>
        <button onclick="switchView('dashboard-view'); toggleSubView('timeline');" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-800 transition-colors w-14">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[10px] tracking-[0.1em] font-medium mt-0.5">时间之轨</span>
        </button>
        <button onclick="openMobileRecordSheet()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-800 transition-colors w-14">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
            <span class="text-[10px] tracking-[0.1em] font-medium mt-0.5">刻录足迹</span>
        </button>
        <button onclick="openVaultDrawer()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-800 transition-colors w-14">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12"></path></svg>
            <span class="text-[10px] tracking-[0.1em] font-medium mt-0.5">漫游主仓</span>
        </button>
    </div>

    <header class="hidden md:flex w-full px-8 md:px-12 py-8 justify-between items-center fixed top-0 z-40">
        <div class="flex items-center gap-6">
            <div class="text-2xl font-serif-sc font-normal tracking-[0.2em] text-slate-800 cursor-pointer drop-shadow-sm" onclick="switchView('landing-view')">行迹</div>
            <button id="global-back-btn" onclick="goBack()" class="hidden px-5 py-2.5 rounded-full glass-btn text-xs font-normal tracking-widest">← 返回</button>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="switchView('landing-view')" class="px-5 py-2.5 rounded-full glass-btn text-xs font-normal tracking-widest">首页</button>
            <button onclick="switchView('dashboard-view')" class="px-5 py-2.5 rounded-full glass-btn text-xs font-normal tracking-widest">地球大盘</button>
            
            <div class="flex items-center gap-2 ml-2 bg-slate-800/80 hover:bg-slate-700 backdrop-blur-md rounded-full pr-6 pl-2 py-1.5 shadow-lg relative cursor-pointer transition-colors border border-white/10" onclick="switchView('vault-view')">
                <div class="relative group/avatar cursor-pointer" onclick="event.stopPropagation(); document.getElementById('avatar-upload').click();" title="点击焕新星空面容">
                    <img id="nav-avatar" src="" class="w-8 h-8 rounded-full bg-slate-900 object-cover border border-white/30 shadow-sm">
                    <div class="absolute inset-0 bg-black/60 rounded-full opacity-0 group-hover/avatar:opacity-100 flex items-center justify-center transition-opacity duration-300">
                        <span class="text-white text-[9px] tracking-widest">焕新</span>
                    </div>
                </div>
                <span id="user-badge" class="text-white text-[11px] font-normal tracking-widest ml-2 truncate max-w-[150px]">未契入星空</span>
                <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
            </div>
            
            <button onclick="logout()" title="安全退出当前账号" class="w-10 h-10 rounded-full glass-btn flex items-center justify-center text-sm shadow-sm hover:bg-red-50 hover:text-red-500 transition-colors">🚪</button>
        </div>
    </header>

    <section id="landing-view" class="view-section relative z-10 min-h-screen flex flex-col justify-center items-center px-4">
        <div class="text-center max-w-4xl mx-auto space-y-14 mt-10">
            <h1 class="text-[2.5rem] md:text-[4.5rem] font-serif-sc font-light text-slate-800 leading-[1.5] tracking-[0.08em] drop-shadow-sm">
                在地球的坐标里<br>收纳你闪闪发光的日子
            </h1>
            <div class="flex flex-col md:flex-row justify-center items-center gap-6 pt-6">
                <button onclick="openRecordView()" class="w-56 py-4 bg-[#1e293b] text-white font-normal rounded-full shadow-2xl hover:bg-slate-700 hover:-translate-y-1 transition-all text-sm tracking-[0.15em]">+ 刻录新足迹</button>
                <button onclick="switchView('dashboard-view')" class="w-56 py-4 glass-btn text-slate-700 font-normal rounded-full text-sm tracking-[0.15em]">漫游记忆大盘</button>
            </div>
        </div>
    </section>

    <section id="record-view" class="view-section hidden md:flex fixed md:relative z-[10001] md:z-10 bottom-0 md:bottom-auto left-0 md:left-auto w-full md:w-auto h-[90dvh] md:min-h-screen bg-[#f8fafc] md:bg-transparent rounded-t-[2.5rem] md:rounded-t-none translate-y-full md:translate-y-0 transition-transform duration-500 justify-center items-start md:items-center px-4 py-8 md:py-32 shadow-[0_-20px_40px_-15px_rgba(0,0,0,0.1)] md:shadow-none overflow-y-auto md:overflow-visible">
        <div class="w-full max-w-[850px] glass-panel p-8 md:p-12 space-y-10 relative">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 md:hidden"></div>
            <h2 id="form-title" class="text-2xl font-serif-sc font-normal text-slate-800 tracking-[0.15em] border-b border-slate-200/50 pb-6">刻录新行迹</h2>
            <form class="space-y-8" id="trace-form" onsubmit="handleFormSubmit(event)">
                <div class="flex justify-center mb-6">
                    <div class="bg-slate-100/80 p-1.5 rounded-full flex gap-2 relative shadow-inner border border-slate-200/50">
                        <button type="button" id="tab-domestic" onclick="switchFormMode('domestic')" class="px-8 py-2.5 rounded-full text-[11px] font-medium bg-white text-slate-800 shadow-sm transition-all tracking-widest">华夏足迹</button>
                        <button type="button" id="tab-global" onclick="switchFormMode('global')" class="px-8 py-2.5 rounded-full text-[11px] font-medium text-slate-400 hover:text-slate-600 transition-all tracking-widest">环球漫游</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
                    <div class="flex flex-col">
                        <label class="block text-[11px] font-medium text-slate-400 mb-3 tracking-widest uppercase">相遇日期 *</label>
                        <input type="date" id="form-date" required class="w-full px-5 h-[56px] box-border bg-white/70 border border-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-100 font-normal text-slate-700 transition-all text-sm flex items-center">
                    </div>
                    <div class="flex flex-col">

        // ==========================================
        // 🌟 V1.4 影像双轨解析器与画廊引擎
        // ==========================================
        function parsePhotoUrl(rawStr) {
            if (!rawStr) return { thumb: '', hd: '' };
            // 如果是 V1.4 新版双轨 URL
            if (rawStr.includes('|*|')) {
                const parts = rawStr.split('|*|');
                return { thumb: BACKEND_URL + parts[0], hd: BACKEND_URL + parts[1] };
            }
            // 兼容历史数据 (Base64) 或老的单斜杠路径
            let url = rawStr;
            if (!rawStr.startsWith('data:image') && rawStr.startsWith('/')) {
                url = BACKEND_URL + rawStr;
            }
            return { thumb: url, hd: url };
        }

        function openNodeGallery(nodeId, startIndex) {
            const node = timelineNodesData.find(n => n.node_id === nodeId);
            if(!node) return;
            // 🚀 画廊只加载 HD 高清大图
            currentGallery = node.photo_urls.map(url => parsePhotoUrl(url).hd);
            currentGalleryIndex = startIndex;
            showGalleryModal();
        }

        function openVaultGallery(startIndex) {
            // 🚀 画廊只加载 HD 高清大图
            currentGallery = vaultAllPhotos.map(p => parsePhotoUrl(p.url).hd);
            currentGalleryIndex = startIndex;
            showGalleryModal();
        }

        function showGalleryModal() {
            const modal = document.getElementById('photo-preview-modal');
            const img = document.getElementById('photo-preview-img');
            updateGalleryUI();
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.replace('opacity-0', 'opacity-100');
                img.classList.replace('scale-95', 'scale-100');
            }, 10);
        }

        function closePhotoPreview() {
            const modal = document.getElementById('photo-preview-modal');
            const img = document.getElementById('photo-preview-img');
            modal.classList.replace('opacity-100', 'opacity-0');
            img.classList.replace('scale-100', 'scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function updateGalleryUI() {
            document.getElementById('photo-preview-img').src = currentGallery[currentGalleryIndex];
            document.getElementById('gallery-counter').innerText = `${currentGalleryIndex + 1} / ${currentGallery.length}`;
            document.getElementById('gallery-prev').style.display = currentGalleryIndex === 0 ? 'none' : 'block';
            document.getElementById('gallery-next').style.display = currentGalleryIndex === currentGallery.length - 1 ? 'none' : 'block';
        }

        function prevPhoto() {
            if (currentGalleryIndex > 0) {
                currentGalleryIndex--;
                updateGalleryUI();
            }
        }

        function nextPhoto() {
            if (currentGalleryIndex < currentGallery.length - 1) {
                currentGalleryIndex++;
                updateGalleryUI();
            }
        }

        // 双模引擎状态、全球数据集与高性能搜索器实例
        let formMode = 'domestic';
        let globalGeoData = []; 
        let provTS = null; // 省份/国家搜索器
        let cityTS = null; // 城市搜索器

        function initDropdowns() {
            // 初始化 Tom Select，开启丝滑搜索、虚拟渲染，彻底告别卡顿
            const tsConfig = {
                create: false,
                maxOptions: null, // 配合底层虚拟滚动，几万个城市也不会卡
                placeholder: "点击输入搜索...",
                controlInput: '<input type="text" autocomplete="off" />',
                render: { no_results: function(data, escape) { return '<div class="p-3 text-slate-400 text-sm">未找到匹配的星区...</div>'; } }
            };
            
            provTS = new TomSelect('#form-province', tsConfig);
            cityTS = new TomSelect('#form-city', tsConfig);

            // 联动引擎：只要国家/省份一变，立刻更新下方的城市列表
            provTS.on('change', function() { populateCities(); });

            switchFormMode('domestic'); 
        }

        // 🚨 终极防串台锁：记录操作编号与网络请求状态
        let switchToken = 0; 
        let isFetchingGlobal = false;

        async function switchFormMode(mode) {
            formMode = mode;
            const currentToken = ++switchToken; // 领取本次操作的专属号码牌

            // 1. 样式切换
            document.getElementById('tab-domestic').className = mode === 'domestic' ? 'px-8 py-2.5 rounded-full text-[11px] font-medium bg-white text-slate-800 shadow-sm transition-all tracking-widest' : 'px-8 py-2.5 rounded-full text-[11px] font-medium text-slate-400 hover:text-slate-600 transition-all tracking-widest';
            document.getElementById('tab-global').className = mode === 'global' ? 'px-8 py-2.5 rounded-full text-[11px] font-medium bg-white text-slate-800 shadow-sm transition-all tracking-widest' : 'px-8 py-2.5 rounded-full text-[11px] font-medium text-slate-400 hover:text-slate-600 transition-all tracking-widest';
            
            // 2. 核心修复：彻底清空 TomSelect 内存
            provTS.clear(true); provTS.clearOptions();
            cityTS.clear(true); cityTS.clearOptions();

            // 3. 物理隔绝：暴力清空底层的原生 select 标签，彻底切断幽灵数据回流！(解决 sync() 带来的串台根源)
            document.getElementById('form-province').innerHTML = '<option value="" disabled selected></option>';
            document.getElementById('form-city').innerHTML = '<option value="" disabled selected></option>';

            if (mode === 'domestic') {
                document.getElementById('label-province').innerText = "省份/特区 *";
                provTS.settings.placeholder = "点击输入省份 (如: 四川)";
                provTS.control_input.placeholder = "点击输入省份 (如: 四川)"; // 直接修改输入框，抛弃 sync()

                const options = Object.keys(geoProvinceCityLib).map(p => ({value: p, text: p}));
                provTS.addOptions(options);
            } else {
                document.getElementById('label-province').innerText = "漫游国家/地区 *";
                provTS.settings.placeholder = "正在拉取全球星图...";
                provTS.control_input.placeholder = "正在拉取全球星图...";
                
                // 4. 网络防抖锁：如果已经在拉取，绝不重复发请求
                if (globalGeoData.length === 0) {
                    if (!isFetchingGlobal) {
                        isFetchingGlobal = true;
                        try {
                            const res = await fetch('https://countriesnow.space/api/v0.1/countries');
                            const data = await res.json();
                            
                            const blockedRegions = ['taiwan', 'hong kong', 'macao', 'macau'];
                            globalGeoData = data.data.filter(c => {
                                const countryName = c.country.toLowerCase();
                                return !blockedRegions.some(blocked => countryName.includes(blocked));
                            });
                        } catch(e) { 
                            triggerToast("全球星图网络微弱"); 
                        } finally {
                            isFetchingGlobal = false;
                        }
                    } else {
                        // 如果发现别的请求正在拉取，这里安静等待它完成即可
                        while(isFetchingGlobal) { await new Promise(r => setTimeout(r, 100)); }
                    }
                }
                
                // 5. 校验号码牌，如果不一致说明拉取期间用户已切走，直接丢弃
                if (currentToken !== switchToken) return;
                
                // 渲染海外数据前，再执行一次物理清扫，确保万无一失
                provTS.clear(true); provTS.clearOptions();
                document.getElementById('form-province').innerHTML = '<option value="" disabled selected></option>';
                
                provTS.settings.placeholder = "点击输入国家 (支持英文搜索)";
                provTS.control_input.placeholder = "点击输入国家 (支持英文搜索)";
                
                const options = globalGeoData.sort((a,b) => a.country.localeCompare(b.country)).map(c => ({value: c.country, text: c.country}));
                provTS.addOptions(options);
            }
        }
        function populateCities() {
            const selectedVal = provTS.getValue();
            cityTS.clear(); cityTS.clearOptions();
            if (!selectedVal) return;

            let options = [];
            if (formMode === 'domestic' && geoProvinceCityLib[selectedVal]) {
                options = Object.keys(geoProvinceCityLib[selectedVal]).map(c => ({value: c, text: c}));
            } else if (formMode === 'global') {
                const countryObj = globalGeoData.find(c => c.country === selectedVal);
                if (countryObj && countryObj.cities) {
                    options = countryObj.cities.map(c => ({value: c, text: c}));
                }
            }
            cityTS.settings.placeholder = "点击输入检索城市...";
            cityTS.sync();
            cityTS.addOptions(options);
        }

        function checkUserLogin() {
            const code = localStorage.getItem('trace_user_code');
            const avatar = localStorage.getItem('trace_user_avatar') || DEFAULT_AVATAR_B64;
            
            if (!code) {
                // 🚨 核心改动：未登录时不再硬性弹窗阻断，隐式切入沙箱体验模式
                isGuestMode = true;
                document.getElementById('user-badge').innerText = "🌟 星空观测者 (体验模式)";
                document.getElementById('vault-user-title').innerText = "🌟 星空观测者 (体验模式)";
                document.getElementById('nav-avatar').src = avatar;
                document.getElementById('vault-avatar').src = avatar;
                return 'demo_explorer'; // 隐式向后端返回官方演示账号，拉取满天星样板大盘
            }
            
            isGuestMode = false;
            document.getElementById('user-badge').innerText = `${code} 的漫游仓`;
            document.getElementById('vault-user-title').innerText = `${code} 的漫游仓`;
            document.getElementById('nav-avatar').src = avatar;
            document.getElementById('vault-avatar').src = avatar;
            return code;
        }

        async function handleAuth(type) {
            const code = document.getElementById('user-code-input').value.trim();
            const pwd = document.getElementById('user-password-input').value.trim();
            if(!code || !pwd) { triggerToast("用户名与密钥不可为空"); return; }
            
            const endpoint = type === 'login' ? '/api/login' : '/api/register';
            try {
                const response = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_code: code, password: pwd })
                });
                const resData = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('trace_user_code', code);
                    if(resData.avatar) localStorage.setItem('trace_user_avatar', resData.avatar);
                    else if(type === 'register') localStorage.setItem('trace_user_avatar', DEFAULT_AVATAR_B64);
                    
                    document.getElementById('auth-overlay').classList.add('hidden');
                    checkUserLogin(); 
                    
                    // 🚨 核心 PLG 转换点：检测是否有刚才填了一半的数据？
                    if (pendingTraceData) {
                        triggerToast("✨ 契入成功！正在为您自动铭刻刚刚保留的记忆...");
                        
                        let lat = null; let lon = null;
                        if (pendingTraceData.formMode === 'domestic') {
                            if (geoProvinceCityLib[pendingTraceData.province] && geoProvinceCityLib[pendingTraceData.province][pendingTraceData.city]) {
                                const coords = geoProvinceCityLib[pendingTraceData.province][pendingTraceData.city];
                                lon = coords[0]; lat = coords[1];
                            }
                        } else {
                            try {
                                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&city=${encodeURIComponent(pendingTraceData.city)}&country=${encodeURIComponent(pendingTraceData.province)}&limit=1`);
                                const data = await res.json();
                                if (data && data.length > 0) {
                                    lat = parseFloat(data[0].lat); lon = parseFloat(data[0].lon);
                                }
                            } catch(e) { console.warn(e); }
                        }

                        const autoPayload = {
                            user_code: code,
                            visit_date: pendingTraceData.visit_date,
                            city: pendingTraceData.city,
                            visit_time: pendingTraceData.visit_time,
                            location_name: pendingTraceData.location_name,
                            companion: pendingTraceData.companion,
                            expense: pendingTraceData.expense,
                            diary_text: pendingTraceData.diary_text,
                            photo_urls: pendingTraceData.photo_urls,
                            latitude: lat, longitude: lon
                        };

                        fetch(`${BACKEND_URL}/api/add_node`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(autoPayload)
                        }).then(autoRes => {
                            if (autoRes.ok) {

       // ==========================================
        // 🌟 V1.4 双轨压缩与物理上传引擎 (Helpers)
        // ==========================================
        function compressImageToBlob(img, maxWidth, quality) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
            });
        }

        async function uploadBlob(blob, filename) {
            const formData = new FormData();
            formData.append('file', blob, filename);
            const res = await fetch(`${BACKEND_URL}/api/upload_image`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.status === 'success') {
                return data.url; // 返回如 /uploads/xxx.jpg
            }
            throw new Error(data.message);
        }

        // ==========================================
        // 🌟 V1.4 核心改造：照片处理转为纯异步流
        // ==========================================
        async function processPhotos(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const firstFile = files[0];

            // 1. 严格拦截 PC 端漏网的 HEIC
            if (firstFile.name.toLowerCase().endsWith('.heic')) {
                triggerToast("⚠️ 请上传 JPG/PNG 格式，或使用手机直接摄取");
                event.target.value = ''; 
                return;
            }

            // 2. 时空萃取舱 (保留原有 exifr 逻辑)
            try {
                const gpsData = await exifr.gps(firstFile);
                const exifData = await exifr.parse(firstFile);
                let hasExtracted = false;

                if (exifData && exifData.DateTimeOriginal) {
                    const d = new Date(exifData.DateTimeOriginal);
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const hours = String(d.getHours()).padStart(2, '0');
                    const mins = String(d.getMinutes()).padStart(2, '0');
                    
                    document.getElementById('form-date').value = `${year}-${month}-${day}`;
                    document.getElementById('form-time').value = `${hours}:${mins}`;
                    hasExtracted = true;
                }

                if (gpsData && gpsData.latitude && gpsData.longitude) {
                    const lat = gpsData.latitude;
                    const lon = gpsData.longitude;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=zh-CN`);
                        const data = await res.json();
                        if (data && data.address) {
                            const state = data.address.state || '';
                            const city = data.address.city || data.address.town || data.address.county || state;
                            autoSelectLocation(state, city);
                            triggerToast("✨ 捕捉到时空星轨，已自动校准坐标");
                        }
                    } catch (e) {
                        console.error("星网坐标解析微弱:", e);
                    }
                    hasExtracted = true;
                } else if (hasExtracted) {
                    triggerToast("✨ 已萃取拍摄时间 (该影像无空间坐标)");
                }
            } catch (error) {
                console.error("【EXIF 解析舱受损】:", error);
            }

            // 3. 异步双轨上传舱 (UI Loading 保护)
            const uploadBox = document.querySelector('input#photo-input').nextElementSibling;
            const originalBoxHTML = uploadBox.innerHTML;
            uploadBox.innerHTML = '<span class="text-lg opacity-80 font-serif-sc tracking-widest text-blue-600">⏳ 正在萃取并上传光影...</span>';
            uploadBox.classList.add('pointer-events-none', 'bg-blue-50/50'); // 锁定上传按钮防止重复点击

            try {
                for (let file of files) {
                    await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const img = new Image();
                            img.onload = async function() {
                                try {
                                    // 🚀 前端多线程压制：缩略图(400px) + 高清原图(1800px)
                                    const thumbBlob = await compressImageToBlob(img, 400, 0.65);
                                    const hdBlob = await compressImageToBlob(img, 1800, 0.85);

                                    // 🚀 上传至服务器物理磁盘
                                    const thumbUrl = await uploadBlob(thumbBlob, `thumb_${file.name}`);
                                    const hdUrl = await uploadBlob(hdBlob, `hd_${file.name}`);

                                    // 🚀 组合成 [缩略图|*|高清图] 的魔术字符串，存入待提交数组
                                    compressedPhotoB64Array.push(`${thumbUrl}|*|${hdUrl}`);
                                    renderPhotoPreviewEditor();
                                    resolve();
                                } catch(err) {
                                    reject(err);
                                }
                            };
                            img.onerror = reject;
                            img.src = e.target.result;
                        };
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                }
                triggerToast("✨ 光影已安全存入星空图床");
            } catch (error) {
                console.error(error);
                triggerToast("⚠️ 光影上传失败，请检查网络信号");
            } finally {
                // 恢复上传按钮状态
                uploadBox.innerHTML = originalBoxHTML;
                uploadBox.classList.remove('pointer-events-none', 'bg-blue-50/50');
                event.target.value = '';
            }
        }

        function removePhoto(idx) {
            compressedPhotoB64Array.splice(idx, 1);
            renderPhotoPreviewEditor();
        }

        // 🌟 V1.4 向后兼容的渲染器
        function renderPhotoPreviewEditor() {
            const box = document.getElementById('photo-preview-box');
            if (!box) return;
            box.innerHTML = '';
            
            compressedPhotoB64Array.forEach((item, idx) => {
                let displayUrl = item;
                // 兼容逻辑：如果是新版双轨 URL
                if (item.includes('|*|')) {
                    // 表单预览只加载极速缩略图，并拼接上后端域名
                    displayUrl = BACKEND_URL + item.split('|*|')[0];
                } 
                // 兼容逻辑：如果是老版 Base64，且不是以 http 开头（避免异常）
                else if (!item.startsWith('data:image') && item.startsWith('/')) {
                    displayUrl = BACKEND_URL + item;
                }

                box.innerHTML += `
                <div class="relative group aspect-square rounded-2xl overflow-hidden border border-slate-200/50 shadow-sm">
                    <img src="${displayUrl}" class="w-full h-full object-cover">
                    <div onclick="removePhoto(${idx})" class="absolute top-2 right-2 w-6 h-6 bg-slate-900/50 backdrop-blur-md text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer hover:bg-red-500 z-10 text-sm shadow-lg">
                        &times;
                    </div>
                </div>`;
            });
        }

        let leafletMap = null; 
        let markerClusterGroup = null; 

        function renderLeafletMap() {
            const uniqueCities = [...new Set(timelineNodesData.map(n => n.city))];
            const countEl = document.getElementById('stat-cities-count');
            if (countEl) countEl.innerText = uniqueCities.length;

            if (!leafletMap) {
                const corner1 = L.latLng(-90, -180);
                const corner2 = L.latLng(90, 180);
                const worldBounds = L.latLngBounds(corner1, corner2);

                leafletMap = L.map('leaflet-map-container', { 
                    zoomControl: false, 
                    attributionControl: false,
                    maxBounds: worldBounds,       
                    maxBoundsViscosity: 1.0,      
                    minZoom: 3                    
                }).setView([35.8617, 104.1954], 4);
                
                L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}', {
                    maxZoom: 19, 
                    minZoom: 3, 
                    className: 'map-arcgis-filter',
                    noWrap: true 
                }).addTo(leafletMap);
            }

            if (markerClusterGroup) { leafletMap.removeLayer(markerClusterGroup); }
            
            markerClusterGroup = L.markerClusterGroup({
                showCoverageOnHover: false, 
                maxClusterRadius: 45, 
                spiderfyOnMaxZoom: true,
                zoomToBoundsOnClick: true,
                spiderfyDistanceMultiplier: 1.8, 
                spiderLegPolylineOptions: { weight: 1.5, color: '#94a3b8', opacity: 0.6 }, 
                
                iconCreateFunction: function(cluster) {
                    const count = cluster.getChildCount();
                    const markers = cluster.getAllChildMarkers();
                    let coverImg = null;
                    
                    for (let i = 0; i < markers.length; i++) {
                        if (markers[i].options.trace_photo) {
                            // 🚀 获取地图气泡封面缩略图
                            coverImg = parsePhotoUrl(markers[i].options.trace_photo).thumb;
                            break;
                        }
                    }

                    if (coverImg) {
                        return L.divIcon({
                            html: `
                            <div class="relative group cursor-pointer transform hover:scale-110 transition-transform duration-300 z-50">
                                <img src="${coverImg}" class="w-[56px] h-[56px] rounded-[16px] object-cover border-[3px] border-white shadow-xl">
                                <div class="absolute -top-2 -right-2 bg-slate-900/90 backdrop-blur-md text-white text-[10px] font-bold px-2 py-0.5 rounded-full border border-white/50 shadow-sm z-10 shadow-black/30">
                                    +${count}
                                </div>
                            </div>`,
                            className: 'bg-transparent border-none',
                            iconSize: [56, 56],
                            iconAnchor: [28, 28]
                        });
                    } else {
                        return L.divIcon({
                            html: `<div class="bg-slate-800/90 backdrop-blur-md text-white w-12 h-12 flex items-center justify-center rounded-full border-[3px] border-white shadow-xl font-bold font-sans transition-transform hover:scale-110">${count}</div>`,
                            className: 'bg-transparent border-none',
                            iconSize: [48, 48],
                            iconAnchor: [24, 24]
                        });
                    }
                }
            });

            markerClusterGroup.on('spiderfied', function(e) { if (e.cluster._icon) e.cluster._icon.style.display = 'none'; });
            markerClusterGroup.on('unspiderfied', function(e) { if (e.cluster._icon) e.cluster._icon.style.display = 'block'; });

            timelineNodesData.forEach(node => {
                let coords = null;
                const prov = getProvinceByExactCity(node.city);
                if (prov && geoProvinceCityLib[prov][node.city]) { coords = geoProvinceCityLib[prov][node.city]; }
                else if (node.latitude && node.longitude) { coords = [node.longitude, node.latitude]; } 

                if (coords) {
                    const lat = coords[1]; const lon = coords[0];
                    if (node.photo_urls && node.photo_urls.length > 0 && node.photo_urls[0] !== "") {
                        const imgUrl = node.photo_urls[0];
                        const parsedUrl = parsePhotoUrl(imgUrl).thumb; // 🚀 地图分裂气泡只加载小图
                        const customIcon = L.divIcon({
                            className: 'bg-transparent border-none',
                            html: `<div class="relative group cursor-pointer transform hover:scale-110 transition-transform duration-300 z-50"><img src="${parsedUrl}" class="w-[52px] h-[52px] rounded-[16px] object-cover border-[3px] border-white shadow-xl"></div>`,
                            iconSize: [52, 52], iconAnchor: [26, 26]
                        });
                        const marker = L.marker([lat, lon], { icon: customIcon, trace_photo: imgUrl });
                        marker.on('click', () => openCityDetailDrawer(node.city));
                        markerClusterGroup.addLayer(marker);
                    } else {
                        const dotIcon = L.divIcon({
                            className: 'bg-transparent border-none',
                            html: `<div class="w-4 h-4 bg-blue-500 rounded-full border-2 border-white shadow-sm hover:scale-150 transition-transform duration-300 cursor-pointer"></div>`,
                            iconSize: [16, 16], iconAnchor: [8, 8]
                        });
                        const marker = L.marker([lat, lon], { icon: dotIcon });
                        marker.on('click', () => openCityDetailDrawer(node.city));
                        markerClusterGroup.addLayer(marker);
                    }
                }
            });
            
            leafletMap.addLayer(markerClusterGroup);
            setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 300);
        }
        
       
        function openFeedback() {
            document.getElementById('feedback-modal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('feedback-modal').classList.replace('opacity-0', 'opacity-100');
                document.getElementById('feedback-drawer').classList.remove('translate-x-full');
            }, 10);
        }
        function closeFeedback() {
            document.getElementById('feedback-modal').classList.replace('opacity-100', 'opacity-0');
            document.getElementById('feedback-drawer').classList.add('translate-x-full');
            setTimeout(() => document.getElementById('feedback-modal').classList.add('hidden'), 300);
        }
        async function submitFeedback() {
            if (isGuestMode) { triggerToast("🔒 请先契入漫游舱，再发射意见回音"); document.getElementById('auth-overlay').classList.remove('hidden'); return; }
            const currentCode = localStorage.getItem('trace_user_code') || '匿名漫游者';
            const type = document.getElementById('fb-type').value;
            const content = document.getElementById('fb-content').value.trim();
            if(!content) { triggerToast("吐槽内容不能为空哦"); return; }
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/submit_feedback`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_code: currentCode, type: type, content: content })
                });
                if(res.ok) {
                    triggerToast("🚀 发射成功！星空监测员已收到你的回音");
                    document.getElementById('fb-content').value = '';
                    closeFeedback();
                }
            } catch(e) { triggerToast("呼叫星空监测站失败，请检查信号"); }
        }

        function getProvinceByExactCity(cityName) {
            for(let prov in geoProvinceCityLib) { if(geoProvinceCityLib[prov][cityName]) return prov; } return null;
        }

        function openProvinceDetailDrawer(provinceName) {
            const nodes = timelineNodesData.filter(n => getProvinceByExactCity(n.city) === provinceName);
            if(nodes.length === 0) { triggerToast(`${provinceName} 暂未留下足迹`); return; }
            document.getElementById('detail-modal-title').innerText = `📍 ${provinceName} 漫游录`;
            renderNodesToDrawer(nodes);
            slideInDrawer();
        }

        function openCityDetailDrawer(cityName) {
            const nodes = timelineNodesData.filter(n => n.city === cityName);
            document.getElementById('detail-modal-title').innerText = `📍 ${cityName} 漫游录`;
            renderNodesToDrawer(nodes);
            slideInDrawer();
        }

        function slideInDrawer() {
            const modal = document.getElementById('detail-modal');
            const drawer = document.getElementById('detail-drawer');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.replace('opacity-0', 'opacity-100'); drawer.classList.remove('translate-x-full'); }, 10);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            const drawer = document.getElementById('detail-drawer');
            modal.classList.replace('opacity-100', 'opacity-0');
            drawer.classList.add('translate-x-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

            const container = document.getElementById('detail-modal-content');
            let html = '';

                let photoHtml = '';

                    photoHtml = `<div class="flex gap-2 overflow-x-auto mt-4 pb-2 scrollbar-hide">`;
                    node.photo_urls.forEach((url, idx) => {
                        const parsed = parsePhotoUrl(url); // 🚀 解析双轨
                        photoHtml += `<img loading="lazy" src="${parsed.thumb}" onclick="openNodeGallery(${node.node_id}, ${idx})" class="h-16 w-16 md:h-20 md:w-20 object-cover rounded-xl shadow-sm border border-slate-200 flex-shrink-0 cursor-pointer hover:opacity-80 transition-opacity">`;
                    });
                    photoHtml += `</div>`;
                }
                html += `

                    <div class="absolute right-4 top-4 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2 z-10">
                        <button onclick="editNode(${node.node_id})" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-full text-xs shadow-sm" title="修改记录">✏️</button>
                        <button onclick="deleteNode(${node.node_id})" class="p-2 bg-red-50 hover:bg-red-100 text-red-500 rounded-full text-xs shadow-sm" title="擦除记录">🗑️</button>
                    </div>
                    <div class="flex justify-between items-start mb-3 pr-16">
                        <h4 class="text-lg font-serif-sc text-slate-800">${node.location_name || node.city}</h4>
                        <span class="text-[10px] text-slate-400 font-sans tracking-widest bg-slate-50 px-3 py-1 rounded-full">${node.visit_time || '全天'}</span>
                    </div>
                    <div class="text-xs text-slate-500 font-medium tracking-widest space-y-1 mb-3">
                        ${node.companion ? `<p>羁绊：${node.companion}</p>` : ''}
                        ${node.expense ? `<p>开销：¥${node.expense}</p>` : ''}
                    </div>
                    <p class="text-sm text-slate-600 leading-relaxed font-serif-sc font-light pt-2 border-t border-slate-100">${node.diary_text || '没有留下只言片语，或许此时无声胜有声...'}</p>

        function switchVaultTab(tabName) {
            currentVaultTab = tabName;
            document.querySelectorAll('.vault-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            renderVaultTabContent();
        }

        function updateVaultStats() {
            const cityGroups = {}; let totalPhotos = 0, totalExpense = 0;
            timelineNodesData.forEach(n => {
                if(!cityGroups[n.city]) cityGroups[n.city] = 1;
                if(n.expense && !isNaN(parseFloat(n.expense))) totalExpense += parseFloat(n.expense);
                if(n.photo_urls && n.photo_urls.length > 0 && n.photo_urls[0] !== "") totalPhotos += n.photo_urls.length;
            });
            document.getElementById('vault-city-stat').innerText = Object.keys(cityGroups).length;
            document.getElementById('vault-node-stat').innerText = timelineNodesData.length;
            document.getElementById('vault-photo-stat').innerText = totalPhotos;
            document.getElementById('vault-expense-stat').innerText = `¥${totalExpense.toFixed(0)}`;
        }

        function renderVaultTabContent() {
            const container = document.getElementById('vault-content-dynamic');
            let html = '';
            
            if(timelineNodesData.length === 0) {
                html = `<div class="text-center py-16 text-slate-400 text-sm font-serif-sc tracking-widest">星空尚且空白，等待你的第一次闪烁...</div>`;
            } else if(currentVaultTab === 'cities') {
                const cityData = {};
                timelineNodesData.forEach(n => { 
                    if(!cityData[n.city]) cityData[n.city] = { count: 0, cover: null }; 
                    cityData[n.city].count++; 
                    if(!cityData[n.city].cover && n.photo_urls && n.photo_urls.length > 0 && n.photo_urls[0] !== "") {
                        cityData[n.city].cover = n.photo_urls[0];
                    }
                });
                
                html = `<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-5">`;
                for(let c in cityData) {
                    const parsed = parsePhotoUrl(cityData[c].cover); // 🚀 解析双轨
                    let imgHtml = cityData[c].cover ? 
                        `<img loading="lazy" src="${parsed.thumb}" class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover border-[3px] border-white shadow-md flex-shrink-0">` :
                        `<div class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover border-[3px] border-white shadow-md flex-shrink-0 bg-slate-100 flex items-center justify-center text-slate-300 text-2xl">📍</div>`;
                    
                    html += `
                    <div onclick="openCityDetailDrawer('${c}')" class="p-6 border border-slate-100 rounded-[2rem] cursor-pointer hover:shadow-lg bg-white/60 transition-all flex flex-col items-center justify-center gap-3">
                        ${imgHtml}
                        <div class="text-center mt-1">
                            <h4 class="text-slate-800 font-serif-sc text-lg tracking-widest">${c}</h4>
                            <p class="text-[10px] text-slate-400 mt-1.5 tracking-widest">${cityData[c].count} 条记录</p>
                        </div>
                    </div>`;
                }
                html += `</div>`;
            } else if(currentVaultTab === 'nodes') {
                html = `<div class="space-y-4">`;
                timelineNodesData.forEach(n => {
                    html += `
                    <div class="glass-panel p-5 flex justify-between items-center hover:bg-white/80 transition-all cursor-pointer" onclick="openCityDetailDrawer('${n.city}')">
                        <div>
                            <h4 class="text-slate-800 font-serif-sc text-lg">${n.location_name || n.city}</h4>
                            <p class="text-xs text-slate-400 mt-1 tracking-widest">${n.visit_date.replace(/-/g, '.')} · ${n.companion || '独自漫游'}</p>
                        </div>
                        <div class="text-xl opacity-40 hover:opacity-80 transition-opacity">📝</div>
                    </div>`;
                });
                html += `</div>`;
            } else if(currentVaultTab === 'photos') {
                vaultAllPhotos = [];
                timelineNodesData.forEach(n => {
                    if(n.photo_urls && n.photo_urls.length > 0 && n.photo_urls[0] !== "") {
                        n.photo_urls.forEach(url => vaultAllPhotos.push({url, city: n.city, date: n.visit_date}));
                    }
                });
                if(vaultAllPhotos.length === 0) {
                    html = `<div class="text-center py-16 text-slate-400 text-sm font-serif-sc tracking-widest">暂无光影留存，多去捕捉世界的瞬间吧...</div>`;
                } else {
                    html = `<div class="grid grid-cols-3 md:grid-cols-5 gap-3">`;
                    vaultAllPhotos.forEach((p, idx) => {
                        const parsed = parsePhotoUrl(p.url); // 🚀 解析双轨
                        html += `
                        <div class="relative group aspect-square cursor-pointer overflow-hidden rounded-xl shadow-sm" onclick="openVaultGallery(${idx})">
                            <img src="${parsed.thumb}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-2 pointer-events-none">
                                <span class="text-white text-[10px] tracking-widest truncate">${p.city}</span>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
            } else if(currentVaultTab === 'expenses') {
                const expenseNodes = timelineNodesData.filter(n => n.expense);
                if(expenseNodes.length === 0) {
                    html = `<div class="text-center py-16 text-slate-400 text-sm font-serif-sc tracking-widest">尚未收纳尘世账单，这是一场纯粹的流浪...</div>`;
                } else {
                    html = `<div class="space-y-4">`;
                    expenseNodes.forEach(n => {
                         html += `
                        <div class="glass-panel p-5 flex justify-between items-center">
                            <div>
                                <h4 class="text-slate-800 font-serif-sc text-lg">${n.location_name || n.city}</h4>
                                <p class="text-xs text-slate-400 mt-1 tracking-widest">${n.visit_date.replace(/-/g, '.')}</p>
                            </div>
                            <div class="text-xl font-serif-sc text-slate-700 font-medium">¥${n.expense}</div>
                        </div>`;
                    });
                    html += `</div>`;
                }
            }
            container.innerHTML = html;
            container.style.opacity = 1;
        }

        function triggerToast(msg) {
            const toast = document.getElementById('inline-toast');
            document.getElementById('toast-msg').innerHTML = msg;
            toast.classList.remove('opacity-0', '-translate-y-10', 'scale-95', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0', 'scale-100');
            setTimeout(() => { toast.classList.remove('opacity-100', 'translate-y-0', 'scale-100'); toast.classList.add('opacity-0', '-translate-y-10', 'scale-95', 'pointer-events-none'); }, 1800);
        }

        function switchView(viewId) {
            if (historyStack[historyStack.length - 1] !== viewId) historyStack.push(viewId);
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            document.getElementById('global-back-btn').classList.toggle('hidden', viewId === 'landing-view');
            
            // 🚀 V1.4 缓存分发：如果在内存中，绝不重复拉取数据，直接 0ms 唤醒！
            if (viewId === 'dashboard-view' || viewId === 'vault-view') {
                if (!isDataLoaded) {
                    loadDataFromDatabase(); 
                } else {
                    // 数据都在内存里，只需唤醒 Leaflet 渲染视口防闪烁即可
                    if(leafletMap) setTimeout(() => leafletMap.invalidateSize(), 150);
                }
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        function goBack() { if (historyStack.length > 1) { historyStack.pop(); switchView(historyStack.pop()); } }

        // 🚨 修复 1：补全了 function
        function toggleSubView(type) {
            document.getElementById('sub-view-map').classList.toggle('hidden', type !== 'map');
            document.getElementById('sub-view-timeline').classList.toggle('hidden', type !== 'timeline');
            
            const titleEl = document.getElementById('dashboard-mobile-title');
            if (titleEl) {
                if (window.innerWidth < 768) {
                    titleEl.innerText = type === 'map' ? '漫游记忆大盘' : '时空轨迹线';
                } else {
                    titleEl.innerText = '漫游记忆大盘';
                }
            }

            const btnMap = document.getElementById('btn-map');
            const btnTimeline = document.getElementById('btn-timeline');
            const activeClass = "px-6 py-2.5 text-[11px] font-medium rounded-full bg-slate-800 text-white shadow-md tracking-widest transition-all";
            const inactiveClass = "px-6 py-2.5 text-[11px] font-medium rounded-full text-slate-500 hover:text-slate-800 tracking-widest transition-all";
            
            if(type === 'map') {
                btnMap.className = activeClass; 
                btnTimeline.className = inactiveClass;
                setTimeout(() => { if(leafletMap) leafletMap.invalidateSize(); }, 150); 
            } else {
                btnTimeline.className = activeClass; 
                btnMap.className = inactiveClass;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initDropdowns(); 
            if(checkUserLogin()) loadDataFromDatabase();
            initMobileKeyboardFix(); 
        });

        function openMobileRecordSheet() {
            resetForm();
            if (window.innerWidth < 768) {
                const sheet = document.getElementById('record-view');
                sheet.classList.remove('hidden');
                requestAnimationFrame(() => sheet.classList.remove('translate-y-full'));
                // 视觉补偿：给大盘稍微向上推，露出键盘热区
                if(leafletMap) leafletMap.panBy([0, 100], {animate: true});
            } else {
                switchView('record-view');
            }
        }

        function closeMobileRecordSheet() {
            if (window.innerWidth < 768) {
                const sheet = document.getElementById('record-view');
                sheet.classList.add('translate-y-full');
                setTimeout(() => sheet.classList.add('hidden'), 500);
            } else {
                goBack();
            }
        }

        // 重新接管全局的 openRecordView
        function openRecordView() { openMobileRecordSheet(); }

        // 🚀 全屏沉浸式面板动画控制（不再需要侧滑遮罩）
        function openVaultDrawer() {
            if (window.innerWidth < 768) {
                const drawer = document.getElementById('vault-view');
                drawer.classList.remove('hidden');
                requestAnimationFrame(() => drawer.classList.remove('translate-y-full'));
                
                let mask = document.getElementById('mobile-drawer-mask');
                if(mask) mask.remove();

            }

        function closeVaultDrawer() {
            if (window.innerWidth < 768) {
                const drawer = document.getElementById('vault-view');
                drawer.classList.add('translate-y-full');
                setTimeout(() => drawer.classList.add('hidden'), 500);
            }
        }

        // 软键盘雷达：一旦唤起键盘，物理隐藏导航胶囊防穿模
        function initMobileKeyboardFix() {
            const inputs = document.querySelectorAll('#record-view input, #record-view textarea, #record-view select');
            const nav = document.getElementById('mobile-capsule-nav');
            if(!nav) return;
            inputs.forEach(input => {
                input.addEventListener('focus', () => nav.classList.add('opacity-0', 'pointer-events-none', 'translate-y-full'));
                input.addEventListener('blur', () => nav.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-full'));
            });
        }
