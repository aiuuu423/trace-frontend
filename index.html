    <style>
        /* 极致干净的全局设定 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; 
            overflow-x: hidden; 
            background-color: #eef2f6; 
            color: #334155; 
            margin: 0;
        }
        .font-serif-sc { font-family: 'Noto Serif SC', serif; }
        
        /* 动态交互弥散背景 (鼠标视差层) */
        .mesh-bg-container {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
        }
        .mesh-blob {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6;
            transition: transform 0.4s ease-out;
        }
        .blob-1 { width: 50vw; height: 50vw; background: #bfdbfe; top: -10%; left: -10%; animation: float1 25s infinite alternate ease-in-out; }
        .blob-2 { width: 45vw; height: 45vw; background: #c7d2fe; bottom: -10%; right: -5%; animation: float2 30s infinite alternate-reverse ease-in-out; }
        .blob-3 { width: 35vw; height: 35vw; background: #bae6fd; top: 30%; left: 40%; animation: float3 20s infinite alternate ease-in-out; }

        @keyframes float1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5%, 5%) scale(1.05); } }
        @keyframes float2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5%, -5%) scale(1.1); } }
        @keyframes float3 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(3%, -3%) scale(0.95); } }

        /* 顶级晨露玻璃质感 */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.9); 
            box-shadow: 0 20px 40px -10px rgba(100, 116, 139, 0.12); 
            border-radius: 24px; 
        }
        .glass-btn { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.9); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; color: #475569; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .glass-btn:hover { 
            background: rgba(255, 255, 255, 0.95); transform: translateY(-2px); 
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.2); color: #1e293b; 
        }
        
        .vault-tab { transition: all 0.4s ease; border: 2px solid transparent; }
        .vault-tab.active { 
            background: rgba(255, 255, 255, 0.95); border-color: #e0e7ff; 
            box-shadow: 0 12px 24px -6px rgba(147, 197, 253, 0.25); transform: translateY(-4px); 
        }

        /* 隐藏滚动条让视觉更干净 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }
    </style>
</head>

            "港澳台": {"香港": [114.17, 22.28], "澳门": [113.54, 22.19], "台湾": [121.50, 25.03]}
        };

        // --- 鼠标交互视差效果 ---
        document.addEventListener('mousemove', (e) => {
            const bg = document.getElementById('parallax-bg');
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            bg.style.transform = `translate(${x}px, ${y}px)`;
        });

        function initDropdowns() {
            const provSelect = document.getElementById('form-province');
            for (let prov in geoProvinceCityLib) {
                const opt = document.createElement('option');
                opt.value = prov; opt.innerText = prov;
                provSelect.appendChild(opt);
            }
        }

        function populateCities() {
            const prov = document.getElementById('form-province').value;
            const citySelect = document.getElementById('form-city');
            citySelect.innerHTML = '<option value="" disabled selected>选择城市</option>';
            if(prov && geoProvinceCityLib[prov]) {
                for (let city in geoProvinceCityLib[prov]) {
                    const opt = document.createElement('option');
                    opt.value = city; opt.innerText = city;
                    citySelect.appendChild(opt);
                }
            }
        }

        // [TR-004] 登录校验增强
        function checkUserLogin() {
            const code = localStorage.getItem('trace_user_code');
            if (!code) {
                document.getElementById('auth-overlay').classList.remove('hidden');
                return false;
            }
            document.getElementById('user-badge').innerText = `👨‍🚀 ${code}`;
            document.getElementById('vault-user-title').innerText = `${code}_Trace`;
            return code;
        }

        // [TR-004] 新版加密登录逻辑
        async function saveUserCode() {
            const code = document.getElementById('user-code-input').value.trim();
            const pwd = document.getElementById('user-password-input').value.trim();
            if(!code || !pwd) { triggerCenteredToast("暗号与密钥不可为空"); return; }
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_code: code, password: pwd })
                });
                const resData = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('trace_user_code', code);
                    document.getElementById('auth-overlay').classList.add('hidden');
                    checkUserLogin();
                    loadDataFromDatabase('map');
                    triggerCenteredToast(resData.message);
                } else {
                    triggerCenteredToast(resData.message); // 显示密码错误
                }
            } catch (e) {
                triggerCenteredToast("网络异常，请确认服务器已唤醒");
            }
        }

        function clearUserCode() {
            if(confirm("确定要退出当前暗号吗？退出后下次需重新输入密钥。")) {
                localStorage.removeItem('trace_user_code');
                location.reload();
            }
        }

        function getProvinceByExactCity(cityName) {
            for(let prov in geoProvinceCityLib) {
                if(geoProvinceCityLib[prov][cityName]) return prov;
            }
            return null;
        }

        function processAndCompressPhotos(event) {
            const files = event.target.files;
            const previewBox = document.getElementById('photo-preview-box');
            previewBox.innerHTML = '';
            compressedPhotoB64Array = [];
            
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        const MAX_WIDTH = 800;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedB64 = canvas.toDataURL('image/jpeg', 0.6); 
                        compressedPhotoB64Array.push(compressedB64);

                        const thumb = document.createElement('img');
                        thumb.src = compressedB64;
                        thumb.className = "w-full aspect-square object-cover rounded-xl shadow-md border-2 border-white/50 opacity-90 hover:opacity-100 transition-opacity hover:scale-105 duration-300";
                        previewBox.appendChild(thumb);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const currentCode = checkUserLogin();
            if(!currentCode) return;

            const payload = {
                user_code: currentCode, 
                visit_date: document.getElementById('form-date').value,
                city: document.getElementById('form-city').value, 
                visit_time: document.getElementById('form-time').value,
                location_name: document.getElementById('form-location').value,
                companion: document.getElementById('form-companion').value,
                expense: parseFloat(document.getElementById('form-expense').value) || null,
                diary_text: document.getElementById('form-diary').value,
                photo_urls: compressedPhotoB64Array.join('|||') 
            };
            try {
                const response = await fetch(`${BACKEND_URL}/api/add_node`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                if (response.ok) {
                    triggerCenteredToast("记忆已封存");
                    document.getElementById('trace-form').reset();
                    document.getElementById('photo-preview-box').innerHTML = '';
                    compressedPhotoB64Array = []; 
                    setTimeout(() => { switchView('dashboard-view'); }, 1200);
                }
            } catch (error) { triggerCenteredToast("归档失败"); }
        }

        async function loadDataFromDatabase(mode = 'map') {
            const currentCode = checkUserLogin();
            if(!currentCode) return;
            try {
                const response = await fetch(`${BACKEND_URL}/api/get_nodes?user_code=${encodeURIComponent(currentCode)}&mode=${mode}`);
                const resData = await response.json();
                if(response.ok) {
                    timelineNodesData = resData.data;
                    if (mode === 'map') { renderTimeline(); renderPolygonEchartsMap(); } 
                    else { updateVaultStats(); renderVaultTabContent(); }
                }
            } catch (e) { console.log(e); }
        }

        // [TR-002] 时光轴点击进入详情
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            if(timelineNodesData.length === 0) return;

            timelineNodesData.forEach((node, index) => {
                let coverPhotoHtml = '';
                if(node.photo_urls && node.photo_urls.length > 0 && node.photo_urls[0] !== "") {
                    // 只展示一张封面，提示用户点击查看全部
                    coverPhotoHtml = `
                    <div class="w-full h-48 md:h-64 mt-4 overflow-hidden rounded-[1.5rem] relative group">
                        <img src="${node.photo_urls[0]}" class="w-full h-full object-cover filter group-hover:scale-105 transition-transform duration-700">
                        <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <span class="text-white font-serif-sc tracking-widest text-sm bg-white/20 backdrop-blur-md px-6 py-2 rounded-full border border-white/50 shadow-lg">查看详情录 (${node.photo_urls.length}张)</span>
                        </div>
                    </div>`;
                }

                const item = `
                <div class="relative flex items-start mb-24 w-full group">
                    <div class="hidden md:block w-[22%] text-right pr-12 pt-3">
                        <h3 class="text-[1.8rem] font-serif-sc font-normal text-slate-800 tracking-[0.1em]">${node.visit_date.replace(/-/g, '.')}</h3>
                        <p class="text-xs text-slate-400 mt-2 font-light tracking-[0.2em]">${node.visit_time || '全天'} · <span class="text-blue-500 font-medium">${node.city}</span></p>
                    </div>
                    <div class="absolute left-8 md:left-[22%] w-3 h-3 rounded-full bg-white border-[2.5px] border-blue-400 transform md:-translate-x-[50%] -translate-x-[4px] mt-5 z-10 shadow-sm transition-transform duration-500 group-hover:scale-125"></div>
                    <div class="w-full pl-16 md:pl-12 md:w-[78%]">
                        <div onclick="openNodeDetailModal(${index})" class="glass-panel p-8 md:p-10 rounded-[2.5rem] cursor-pointer hover:shadow-[0_20px_40px_-15px_rgba(147,197,253,0.2)] transition-all hover:bg-white/80 duration-500">
                            <h4 class="text-lg font-serif-sc font-normal text-slate-800 mb-3 md:hidden">${node.visit_date}</h4>
                            <div class="flex flex-col mb-4">
                                <h4 class="text-xl font-normal font-serif-sc text-slate-800 tracking-wide mb-1">
                                    ${node.location_name || node.city}
                                </h4>
                                ${node.companion ? `<span class="text-xs text-slate-500 font-normal tracking-widest block">${node.companion}</span>` : ''}
                            </div>
                            <p class="text-sm leading-relaxed text-slate-600 font-serif-sc font-light tracking-wide line-clamp-2">${node.diary_text || '未留下文字印记。'}</p>
                            ${coverPhotoHtml}
                        </div>
                    </div>
                </div>`;
                container.innerHTML += item;
            });
        }

        // [TR-001] 地图点击联动
        function renderPolygonEchartsMap() {
            const uniqueCities = [...new Set(timelineNodesData.map(n => n.city))];
            const illuminatedProvinces = new Set();
            uniqueCities.forEach(city => {
                const prov = getProvinceByExactCity(city);
                if(prov) illuminatedProvinces.add(prov);
            });

            document.getElementById('stat-cities-count').innerHTML = `${illuminatedProvinces.size} <span class="text-xs font-normal text-slate-400 font-sans tracking-widest uppercase ml-1">版图点亮</span>`;
            const simulatedPercent = Math.min(100, Math.round((illuminatedProvinces.size / 34) * 100));
            document.getElementById('stat-progress-bar').style.width = `${simulatedPercent}%`;
            document.getElementById('stat-progress-percent').innerText = `${simulatedPercent}%`;

            if (!echartsInstance) {
                echartsInstance = echarts.init(document.getElementById('echarts-map-container'));
            }

            const regionsData = [];
            illuminatedProvinces.forEach(prov => {
                let formattedProv = prov === '港澳台' ? '香港' : prov; 
                regionsData.push({
                    name: formattedProv, value: 1,
                    itemStyle: { normal: { areaColor: '#1e3a8a', shadowBlur: 20, shadowColor: '#3b82f6' } } 
                });
            });

            const scatterData = [];
            uniqueCities.forEach(city => {
                const prov = getProvinceByExactCity(city);
                let coords = null;
                if(prov && geoProvinceCityLib[prov][city]) coords = geoProvinceCityLib[prov][city];
                if(coords) scatterData.push({ name: city, value: coords.concat(1) });
            });

            const option = {
                backgroundColor: 'transparent',
                tooltip: { trigger: 'item', formatter: '{b} (点击查看记录)' }, // 增加提示
                geo: {
                    map: 'china', roam: true, zoom: 1.2,
                    label: { emphasis: { show: false } },
                    itemStyle: {
                        normal: { areaColor: '#0f172a', borderColor: '#334155', borderWidth: 1 },
                        emphasis: { areaColor: '#1e293b' }
                    },
                    regions: regionsData 
                },
                series: [
                    {
                        name: '坐标', type: 'effectScatter', coordinateSystem: 'geo',
                        data: scatterData, symbolSize: 12, showEffectOn: 'render',
                        rippleEffect: { brushType: 'stroke', scale: 6 },
                        itemStyle: { normal: { color: '#06b6d4', shadowBlur: 15, shadowColor: '#22d3ee' } } 
                    }
                ]
            };
            echartsInstance.setOption(option);
            
            // [核心联动逻辑] 绑定点击事件
            echartsInstance.off('click'); // 防止重复绑定
            echartsInstance.on('click', function (params) {
                if (params.componentType === 'series') {
                    // 点中了具体的城市光点
                    openCityDetailModal(params.name);
                }
            });

            setTimeout(() => { echartsInstance.resize(); }, 100);
        }

        // ================= 抽屉式详情与相册联动机制 =================
        function openCityDetailModal(cityName) {
            const filteredNodes = timelineNodesData.filter(n => n.city === cityName);
            document.getElementById('detail-modal-title').innerText = `📍 ${cityName} 的行迹`;
            renderNodesToDrawer(filteredNodes);
            slideInDrawer();
        }

        function openNodeDetailModal(nodeIndex) {
            const node = timelineNodesData[nodeIndex];
            document.getElementById('detail-modal-title').innerText = `📅 ${node.visit_date.replace(/-/g, '.')}`;
            renderNodesToDrawer([node]);
            slideInDrawer();
        }

        function slideInDrawer() {
            const modal = document.getElementById('detail-modal');
            const drawer = document.getElementById('detail-drawer');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.replace('opacity-0', 'opacity-100');
                drawer.classList.remove('translate-x-full');
            }, 10);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            const drawer = document.getElementById('detail-drawer');
            modal.classList.replace('opacity-100', 'opacity-0');
            drawer.classList.add('translate-x-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function renderNodesToDrawer(nodes) {
            const container = document.getElementById('detail-modal-content');
            let html = '';
            nodes.forEach(node => {
                let photoHtml = '';
                if (node.photo_urls && node.photo_urls.length > 0 && node.photo_urls[0] !== '') {
                    photoHtml = `<div class="grid grid-cols-3 gap-3 mt-5">`;
                    node.photo_urls.forEach((url, pIdx) => {
                        const globalIndex = timelineNodesData.findIndex(n => n.node_id === node.node_id);
                        photoHtml += `<img src="${url}" onclick="openLightboxByNode(${globalIndex}, ${pIdx})" class="w-full aspect-square object-cover rounded-xl cursor-pointer hover:shadow-lg hover:scale-105 transition-all duration-300">`;
                    });
                    photoHtml += `</div>`;
                }
                html += `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-6 relative">
                    <div class="flex justify-between items-start mb-3">
                        <h4 class="text-lg font-serif-sc text-slate-800">${node.location_name || node.city}</h4>
                        <span class="text-[10px] text-slate-400 font-sans tracking-widest bg-slate-50 px-3 py-1 rounded-full">${node.visit_time || '全天'}</span>
                    </div>
                    ${node.companion ? `<p class="text-xs text-blue-500 mb-3 font-medium tracking-widest">同行羁绊：${node.companion}</p>` : ''}
                    ${node.expense ? `<p class="text-xs text-slate-500 mb-4 font-serif-sc tracking-wide">开销记录：¥${node.expense}</p>` : ''}
                    <p class="text-sm text-slate-600 leading-relaxed font-serif-sc font-light pt-2 border-t border-slate-100">${node.diary_text || '尚未留下文字印记。'}</p>
                    ${photoHtml}
                </div>
                `;
            });
            container.innerHTML = html;
        }

        // ================= [TR-003] 全局 Lightbox 画廊 =================
        function openLightboxByNode(nodeIndex, photoIndex) {
            const node = timelineNodesData[nodeIndex];
            if(!node || !node.photo_urls) return;
            currentLightboxPhotos = node.photo_urls;
            currentLightboxIndex = photoIndex;
            updateLightboxView();

            const overlay = document.getElementById('lightbox-overlay');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.replace('opacity-0', 'opacity-100'), 10);
        }

        function closeLightbox() {
            const overlay = document.getElementById('lightbox-overlay');
            overlay.classList.replace('opacity-100', 'opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function changeLightbox(direction) {
            currentLightboxIndex += direction;
            if(currentLightboxIndex < 0) currentLightboxIndex = currentLightboxPhotos.length - 1;
            if(currentLightboxIndex >= currentLightboxPhotos.length) currentLightboxIndex = 0;
            updateLightboxView();
        }

        function updateLightboxView() {
            document.getElementById('lightbox-img').src = currentLightboxPhotos[currentLightboxIndex];
            document.getElementById('lightbox-indicator').innerText = `IMAGE ${currentLightboxIndex + 1} / ${currentLightboxPhotos.length}`;
        }
        
        // 键盘左右键支持相册翻页
        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('lightbox-overlay');
            if(!overlay.classList.contains('hidden')) {
                if(e.key === 'ArrowLeft') changeLightbox(-1);
                if(e.key === 'ArrowRight') changeLightbox(1);
                if(e.key === 'Escape') closeLightbox();
            }
        });
        // ========================================================

        // [我的主仓面板联动优化]
        function switchVaultTab(tabName) {
            currentVaultTab = tabName;
            document.querySelectorAll('.vault-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            renderVaultTabContent();
        }

        function updateVaultStats() {
            const cityGroups = {};
            let totalPhotos = 0, totalExpense = 0;

            timelineNodesData.forEach(n => {
                if(!cityGroups[n.city]) cityGroups[n.city] = 1;
                if(n.expense) totalExpense += n.expense;
                if(n.photo_urls && n.photo_urls[0] !== "") totalPhotos += n.photo_urls.length;
            });

            document.getElementById('vault-city-stat').innerText = Object.keys(cityGroups).length;
            document.getElementById('vault-node-stat').innerText = timelineNodesData.length;
            document.getElementById('vault-photo-stat').innerText = totalPhotos;
            document.getElementById('vault-expense-stat').innerText = `¥${totalExpense.toFixed(0)}`;
        }

        function renderVaultTabContent() {
            const container = document.getElementById('vault-content-dynamic');
            container.style.opacity = 0;
            
            setTimeout(() => {
                let html = '';
                if(timelineNodesData.length === 0) {
                    html = `<div class="text-center py-12 text-slate-400 font-light tracking-[0.2em] text-sm">空域尚未开启</div>`;
                } else if(currentVaultTab === 'cities') {
                    const cityGroups = {};
                    timelineNodesData.forEach(n => {
                        if(!cityGroups[n.city]) cityGroups[n.city] = { count: 0, dates: [] };
                        cityGroups[n.city].count += 1;
                        cityGroups[n.city].dates.push(n.visit_date);
                    });
                    html = `<div class="grid grid-cols-1 md:grid-cols-3 gap-6">`;
                    for(let c in cityGroups) {
                        // 城市卡片点击也可以打开侧滑详情
                        html += `
                        <div onclick="openCityDetailModal('${c}')" class="cursor-pointer glass-panel p-6 rounded-3xl flex items-center gap-5 hover:-translate-y-1 hover:shadow-lg transition-all border border-white/60">
                            <div class="w-12 h-12 rounded-full bg-blue-100/50 flex items-center justify-center text-xl shadow-inner border border-white">📍</div>
                            <div>
                                <h4 class="font-normal text-base text-slate-800 tracking-wide">${c}</h4>
                                <p class="text-[10px] text-blue-500 font-medium tracking-widest mt-1">${cityGroups[c].count} 次探索</p>
                            </div>
                        </div>`;
                    }
                    html += `</div>`;
                } else if (currentVaultTab === 'nodes') {
                    html = `<div class="space-y-4">`;
                    timelineNodesData.forEach((n, index) => {
                        // 节点卡片点击打开侧滑详情
                        html += `
                        <div onclick="openNodeDetailModal(${index})" class="cursor-pointer glass-panel p-6 rounded-2xl flex justify-between items-center hover:bg-white/90 hover:shadow-md transition-all border border-white/60">
                            <div>
                                <span class="font-normal font-serif-sc text-slate-800 text-base tracking-widest">${n.visit_date.replace(/-/g, '.')}</span>
                                <span class="text-[11px] text-slate-500 font-medium ml-4 tracking-[0.2em]">${n.city} · ${n.location_name || '未知'}</span>
                            </div>
                            ${n.companion ? `<span class="text-[10px] text-slate-500 font-normal tracking-widest ml-3 border-l border-slate-300 pl-3 hidden md:inline-block">${n.companion}</span>` : ''}
                        </div>`;
                    });
                    html += `</div>`;
                } else if (currentVaultTab === 'photos') {
                    html = `<div class="grid grid-cols-3 md:grid-cols-5 gap-4">`;
                    timelineNodesData.forEach((n, index) => {
                        if(n.photo_urls && n.photo_urls[0] !== "") {
                            n.photo_urls.forEach((url, pIdx) => {
                                // 点击照片打开大图预览
                                html += `<div class="aspect-square rounded-2xl overflow-hidden shadow-md border-2 border-white/80 cursor-pointer hover:shadow-xl hover:scale-105 transition-all"><img src="${url}" onclick="openLightboxByNode(${index}, ${pIdx})" class="w-full h-full object-cover"></div>`;
                            });
                        }
                    });
                    html += `</div>`;
                } else if (currentVaultTab === 'expenses') {
                    let total = 0;
                    html = `<div class="space-y-4">`;
                    timelineNodesData.forEach(n => {
                        if(n.expense) {
                            total += n.expense;
                            html += `
                            <div class="glass-panel p-6 rounded-2xl flex justify-between items-center border border-white/60">
                                <span class="font-normal text-slate-800 text-sm tracking-widest">${n.city} <span class="text-[10px] text-slate-400 ml-3 hidden md:inline-block">${n.visit_date}</span></span>
                                <span class="font-serif-sc font-light text-slate-700 text-lg">¥${n.expense.toFixed(2)}</span>
                            </div>`;
                        }
                    });
                    html += `
                        <div class="pt-6 border-t border-slate-300/50 mt-6 flex justify-between items-end px-2">
                            <span class="text-[10px] font-medium text-slate-400 tracking-[0.2em]">TOTAL EXPENSE</span>
                            <span class="font-serif-sc font-light text-3xl text-slate-800">¥${total.toFixed(2)}</span>
                        </div>
                    </div>`;
                }

                container.innerHTML = html;
                container.style.opacity = 1;
            }, 300); 
        }

        function switchView(viewId) {
            if (historyStack[historyStack.length - 1] !== viewId) historyStack.push(viewId);
            renderView(viewId);
        }
        function goBack() {
            if (historyStack.length > 1) { historyStack.pop(); renderView(historyStack[historyStack.length - 1]); }
        }

        function renderView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            document.getElementById('global-back-btn').classList.toggle('hidden', viewId === 'landing-view');
            
            if (viewId === 'dashboard-view') { 
                loadDataFromDatabase('map'); 
            }
            else if (viewId === 'vault-view') { 
                loadDataFromDatabase('vault'); 
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleSubView(type) {
            document.getElementById('btn-map').className = type === 'map' ? "px-6 py-2.5 text-[11px] font-medium rounded-full bg-slate-800 text-white shadow-md tracking-widest" : "px-6 py-2.5 text-[11px] font-medium rounded-full text-slate-500 hover:text-slate-800 tracking-widest transition-colors";
            document.getElementById('btn-timeline').className = type === 'timeline' ? "px-6 py-2.5 text-[11px] font-medium rounded-full bg-slate-800 text-white shadow-md tracking-widest" : "px-6 py-2.5 text-[11px] font-medium rounded-full text-slate-500 hover:text-slate-800 tracking-widest transition-colors";
            document.getElementById('sub-view-map').classList.toggle('hidden', type !== 'map');
            document.getElementById('sub-view-timeline').classList.toggle('hidden', type !== 'timeline');
            
            if(type === 'map') { 
                setTimeout(() => { if(echartsInstance) echartsInstance.resize(); }, 50); 
            }
        }

        window.onload = function() { 
            initDropdowns();
            checkUserLogin(); 
        }
    </script>
</body>
</html>
